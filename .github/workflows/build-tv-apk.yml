name: Build TryQ8Flix Android TV APK

on:
  push:
    branches: [testWeb]
    paths:
      - 'tv-app/**'
      - '.github/workflows/build-tv-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Build TV test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: tv-app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tv-app/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build Ionic app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare download
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/TryQ8Flix-TV-Beta.apk
          sha256sum build-output/TryQ8Flix-TV-Beta.apk | tee build-output/SHA256.txt

      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: TryQ8Flix-TV-Beta-${{ github.run_number }}
          path: tv-app/build-output/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease for easy downloading
        if: github.ref == 'refs/heads/testWeb'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: tv-app-beta-${{ github.run_number }}
          name: TryQ8Flix TV Beta #${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Android TV testing APK built automatically from testWeb.
            Includes internal WebView video detection, basic ad filtering, redirect prompts and Media3 playback.
            This is a DEBUG-signed test build, not a production release.
          files: |
            tv-app/build-output/TryQ8Flix-TV-Beta.apk
            tv-app/build-output/SHA256.txt
